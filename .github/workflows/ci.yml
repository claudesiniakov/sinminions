name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Сборка ничего не пишет в репозиторий: право записи выдаётся только релизному job.
permissions:
  contents: read

# Повторные пуши в ту же ветку/тег отменяют предыдущий прогон.
# Пуш main и пуша тега на тот же коммит остаются двумя прогонами: у них разные ref,
# и отмена могла бы убить релизный прогон вместо лишнего.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Токен не остаётся в .git/config: этот job исполняет код ветки.
          persist-credentials: false

      - name: Toolchain
        run: |
          # Сборка актуальным SDK: приложение получает текущее оформление системы.
          xcodebuild -version
          sw_vers
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      # Серверы GigaChat подписаны корнем Минцифры: проверяем, что встроенный корень принимается системой.
      - name: Live TLS check (GigaChat)
        continue-on-error: true
        run: SINMINIONS_LIVE_TLS=1 swift test --filter LiveTLSTests 2>&1 | tee live-tls.log

      # Постоянный самоподписанный сертификат: подпись всех сборок одинакова для системы,
      # поэтому разрешение «Универсальный доступ» не сбрасывается при обновлении.
      # В pull_request секретов нет и подпись ad-hoc — ключ рядом с кодом из форка не появляется.
      - name: Signing certificate
        if: github.event_name != 'pull_request'
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then
            echo "Сертификата нет — подпись ad-hoc"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 60 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          HASH="$(security find-certificate -c "SinMinions Signing" -Z "$KEYCHAIN" | awk '/SHA-1/ {print $NF}')"
          test -n "$HASH"
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Package SinMinions.app
        run: ./scripts/build-app.sh

      - name: Smoke test (приложение не падает при запуске, компаньон на экране)
        run: |
          # SINMINIONS_DEMO=1: компаньон говорит реплику, затем открывает настройки — оба состояния попадают на снимки.
          SINMINIONS_DEMO=1 SINMINIONS_SHOT_DIR="$PWD/build" build/SinMinions.app/Contents/MacOS/SinMinions > smoke.log 2>&1 &
          PID=$!
          # Приложение само проходит сцены и перед каждой ставит метку <сцена>.ready — по ней делается снимок.
          for scene in screen settings llm console chat typing unlock lang_en shell style1 style2 style3 style4 analytics coffee ab ab_shell ab_cup ab_cheer ab_sit ab_pajama ab_sing ab_find ab_play v_dialog v_walk v_wave v_stars v_find search find teleport; do
            for i in $(seq 1 120); do [ -f "build/$scene.ready" ] && break; sleep 0.5; done
            if [ ! -f "build/$scene.ready" ]; then
              cat smoke.log
              echo "::error::Сцена $scene не подтвердила готовность"
              exit 1
            fi
            screencapture -x "build/$scene.png"
            test -s "build/$scene.png"
            rm -f "build/$scene.ready"
          done
          if kill -0 $PID 2>/dev/null; then
            echo "Процесс жив после демонстрации порталов"
            cat smoke.log
            kill $PID
          else
            wait $PID || echo "Код выхода: $?"
            cat smoke.log
            sleep 5
            for f in ~/Library/Logs/DiagnosticReports/SinMinions*; do [ -f "$f" ] && head -120 "$f"; done
            exit 1
          fi

      # Ключница подписи больше не нужна: удаляем её в любом исходе job.
      - name: Drop signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: SinMinions-app
          path: |
            build/SinMinions.zip
            build/SinMinions.zip.sha256
            build/screen.png
            build/settings.png
            build/llm.png
            build/unlock.png
            build/typing.png
            build/console.png
            build/teleport.png
            build/analytics.png
            build/shell.png
            build/lang_en.png
            build/style1.png
            build/style2.png
            build/style3.png
            build/style4.png
            build/coffee.png
            build/ab.png
            build/ab_shell.png
            build/ab_cup.png
            build/ab_cheer.png
            build/ab_sit.png
            build/ab_pajama.png
            build/ab_sing.png
            build/ab_find.png
            build/ab_play.png
            build/v_*.png
            build/search.png
            build/find.png
            build/chat.png

  # Публикация отделена от сборки: право записи в репозиторий есть только здесь,
  # и только для тега, который стоит на main и совпадает с версией в собранном архиве.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Позволяет включить ручное подтверждение релиза в настройках репозитория,
    # не меняя workflow. Если правило не задано, шаг не блокируется.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Тег аннотированный и стоит на main
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::Тег $TAG должен быть аннотированным: из его сообщения берутся заметки к релизу (git tag -a $TAG -m '…')"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Коммит тега $TAG не входит в main — релиз с ветки запрещён"
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          name: SinMinions-app
          path: artifact

      - name: Версия в архиве совпадает с тегом
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_REF_NAME#v}"
          unzip -p artifact/SinMinions.zip SinMinions.app/Contents/Info.plist > "$RUNNER_TEMP/Info.plist"
          ACTUAL="$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb"))["CFBundleShortVersionString"])' "$RUNNER_TEMP/Info.plist")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::В сборке версия $ACTUAL, а тег $GITHUB_REF_NAME"
            exit 1
          fi
          (cd artifact && sha256sum -c SinMinions.zip.sha256)

      - name: Release notes from tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP/,$d' > artifact/RELEASE_NOTES.md
          cat artifact/RELEASE_NOTES.md

      # Публикация штатным gh, без сторонних действий с правом записи в репозиторий.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifact/SinMinions.zip artifact/SinMinions.zip.sha256 \
            --verify-tag --title "${GITHUB_REF_NAME}" --notes-file artifact/RELEASE_NOTES.md
